<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(34, 43, 54, 0.12);
        --text: #1d232b;
        --muted: #5c6773;
        --accent: #0f766e;
        --accent-2: #d97706;
        --shadow: 0 24px 60px rgba(18, 26, 33, 0.12);
        --radius: 28px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Aptos", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(217, 119, 6, 0.12), transparent 28%),
          linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
      }

      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 20px 72px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(18, 26, 33, 0.06);
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand strong {
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .brand span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: calc(var(--radius) + 6px);
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        padding: 42px;
        margin-bottom: 28px;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -80px -120px auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 119, 6, 0.2), transparent 70%);
        pointer-events: none;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(290px, 0.9fr);
        gap: 28px;
        align-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 14px;
      }

      .eyebrow::before {
        content: "";
        width: 42px;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), rgba(15, 118, 110, 0.2));
        border-radius: 999px;
      }

      h1 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.4rem, 5vw, 4.3rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 68ch;
      }

      .card {
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 14px 30px rgba(18, 26, 33, 0.05);
        padding: 22px;
      }

      .quickfacts {
        display: grid;
        gap: 14px;
      }

      .quickfact {
        padding: 16px 18px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0.03));
        border: 1px solid rgba(15, 118, 110, 0.12);
      }

      .quickfact small {
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .quickfact strong {
        display: block;
        font-size: 1.02rem;
        line-height: 1.5;
      }

      .section {
        margin-top: 22px;
        padding: 30px 32px;
        border-radius: var(--radius);
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 16px 40px rgba(18, 26, 33, 0.05);
      }

      .section h2 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }

      .section p,
      .section li {
        font-size: 1.02rem;
        line-height: 1.75;
        color: var(--text);
      }

      .section p {
        color: var(--muted);
      }

      .section ul,
      .section ol {
        padding-left: 1.25rem;
      }

      .section li + li {
        margin-top: 0.35rem;
      }

      .timeline {
        display: grid;
        gap: 14px;
        counter-reset: step;
      }

      .step {
        position: relative;
        padding: 18px 18px 18px 62px;
        border-radius: 20px;
        border: 1px solid rgba(29, 35, 43, 0.1);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 252, 246, 0.95));
      }

      .step::before {
        counter-increment: step;
        content: counter(step);
        position: absolute;
        left: 18px;
        top: 18px;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), #0c9a8f);
        color: white;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .step strong {
        display: block;
        font-size: 1.03rem;
        margin-bottom: 6px;
      }

      .step p {
        margin: 0;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .muted {
        color: var(--muted);
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(29, 35, 43, 0.06);
        color: var(--text);
        font-size: 0.92rem;
        font-weight: 600;
      }

      .callout {
        margin-top: 18px;
        padding: 18px 20px;
        border-left: 4px solid var(--accent-2);
        background: rgba(217, 119, 6, 0.08);
        border-radius: 18px;
      }

      .callout strong {
        display: block;
        margin-bottom: 6px;
      }

      code {
        padding: 0.16em 0.38em;
        border-radius: 6px;
        background: rgba(29, 35, 43, 0.08);
      }

      @media (max-width: 860px) {
        .hero-grid,
        .grid-2 {
          grid-template-columns: 1fr;
        }

        .hero,
        .section {
          padding: 22px;
        }

        .topbar {
          border-radius: 24px;
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong>RouteGuardians Manual</strong>
          <span>TransitOps Judge Walkthrough</span>
        </div>
        <div class="pill">Built for the officer workflow</div>
      </header>

      <main>
        {{ content }}
      </main>
    </div>
  </body>
</html>
