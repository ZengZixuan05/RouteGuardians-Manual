<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(34, 43, 54, 0.12);
        --text: #1d232b;
        --muted: #5c6773;
        --accent: #0f766e;
        --accent-2: #d97706;
        --shadow: 0 24px 60px rgba(18, 26, 33, 0.12);
        --radius: 28px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Aptos", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(217, 119, 6, 0.12), transparent 28%),
          linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid rgba(15, 118, 110, 0.32);
        outline-offset: 4px;
        border-radius: 8px;
      }

      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 20px 72px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(18, 26, 33, 0.06);
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand a {
        color: inherit;
        text-decoration: none;
      }

      .brand strong {
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .brand span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .guide-context {
        padding-left: 14px;
        border-left: 1px solid var(--panel-border);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.4;
        white-space: nowrap;
      }

      .topbar-actions,
      .site-nav {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .site-nav {
        position: relative;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 9px 13px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 650;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .nav-link:hover {
        color: var(--accent);
        background: rgba(15, 118, 110, 0.08);
        transform: translateY(-1px);
      }

      .nav-link[aria-current="page"] {
        color: var(--accent);
        background: rgba(15, 118, 110, 0.1);
      }

      .nav-menu {
        position: relative;
      }

      .nav-menu summary {
        list-style: none;
        cursor: pointer;
      }

      .nav-menu summary::-webkit-details-marker {
        display: none;
      }

      .nav-summary {
        gap: 8px;
      }

      .nav-summary::after {
        content: "";
        width: 7px;
        height: 7px;
        margin-left: 2px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
        transition: transform 160ms ease;
      }

      .nav-menu[open] .nav-summary::after {
        transform: rotate(225deg) translate(-1px, -1px);
      }

      .nav-menu[data-current="true"] .nav-summary {
        color: var(--accent);
        background: rgba(15, 118, 110, 0.1);
      }

      .nav-dropdown {
        position: absolute;
        z-index: 5;
        top: calc(100% + 8px);
        right: 0;
        display: grid;
        min-width: 220px;
        padding: 8px;
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 42px rgba(18, 26, 33, 0.14);
      }

      .nav-dropdown .nav-link {
        justify-content: flex-start;
        border-radius: 12px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: calc(var(--radius) + 6px);
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        padding: 42px;
        margin-bottom: 28px;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -80px -120px auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 119, 6, 0.2), transparent 70%);
        pointer-events: none;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(290px, 0.9fr);
        gap: 28px;
        align-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 14px;
      }

      .eyebrow::before {
        content: "";
        width: 42px;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), rgba(15, 118, 110, 0.2));
        border-radius: 999px;
      }

      h1 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.4rem, 5vw, 4.3rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 68ch;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 46px;
        padding: 11px 17px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #0c9187);
        box-shadow: 0 10px 22px rgba(15, 118, 110, 0.18);
        color: #fff;
        font-size: 0.96rem;
        font-weight: 700;
        text-decoration: none;
        transition: box-shadow 160ms ease, transform 160ms ease;
      }

      .button:hover {
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
        transform: translateY(-2px);
      }

      .button-secondary {
        border-color: rgba(15, 118, 110, 0.16);
        background: rgba(15, 118, 110, 0.08);
        box-shadow: none;
        color: var(--accent);
      }

      .button-secondary:hover {
        box-shadow: none;
        background: rgba(15, 118, 110, 0.13);
      }

      .action-note {
        color: var(--muted);
        font-size: 0.94rem;
      }

      .dashboard-access {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 10px;
        margin: 20px 0 0;
        color: var(--muted);
      }

      .dashboard-access strong {
        color: var(--text);
      }

      .dashboard-access a {
        overflow-wrap: anywhere;
      }

      .card {
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 14px 30px rgba(18, 26, 33, 0.05);
        padding: 22px;
      }

      .quickfacts {
        display: grid;
        gap: 14px;
      }

      .quickfact {
        padding: 16px 18px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0.03));
        border: 1px solid rgba(15, 118, 110, 0.12);
      }

      .quickfact small {
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .quickfact strong {
        display: block;
        font-size: 1.02rem;
        line-height: 1.5;
      }

      .credential-lines {
        display: grid;
        gap: 9px;
      }

      .credential-line span {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .credential-line code {
        display: inline-block;
        max-width: 100%;
        padding: 0;
        background: transparent;
        color: var(--text);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.96rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .section {
        margin-top: 22px;
        padding: 30px 32px;
        border-radius: var(--radius);
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 16px 40px rgba(18, 26, 33, 0.05);
      }

      .section h2 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }

      .section p,
      .section li {
        font-size: 1.02rem;
        line-height: 1.75;
        color: var(--text);
      }

      .section p {
        color: var(--muted);
      }

      .section ul,
      .section ol {
        padding-left: 1.25rem;
      }

      .section li + li {
        margin-top: 0.35rem;
      }

      .timeline {
        display: grid;
        gap: 14px;
        margin-bottom: 0;
        padding-left: 0 !important;
        list-style: none;
        counter-reset: step;
      }

      .step {
        position: relative;
        padding: 18px 18px 18px 62px;
        border-radius: 20px;
        border: 1px solid rgba(29, 35, 43, 0.1);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 252, 246, 0.95));
      }

      .step::before {
        counter-increment: step;
        content: counter(step);
        position: absolute;
        left: 18px;
        top: 18px;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), #0c9a8f);
        color: white;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .step > strong {
        display: block;
        font-size: 1.03rem;
        margin-bottom: 6px;
      }

      .step p {
        margin: 0;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .muted {
        color: var(--muted);
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(29, 35, 43, 0.06);
        color: var(--text);
        font-size: 0.92rem;
        font-weight: 600;
      }

      .callout {
        margin-top: 18px;
        padding: 18px 20px;
        border-left: 4px solid var(--accent-2);
        background: rgba(217, 119, 6, 0.08);
        border-radius: 18px;
      }

      .callout > strong {
        display: block;
        margin-bottom: 6px;
      }

      .callout p:last-child,
      .callout span:last-child {
        margin-bottom: 0;
      }

      .role-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
        margin-top: 18px;
        border-top: 1px solid var(--panel-border);
      }

      .role-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 28px;
        border-bottom: 1px solid var(--panel-border);
        text-decoration: none;
        transition: color 160ms ease;
      }

      .role-link:first-child {
        padding-left: 2px;
      }

      .role-link + .role-link {
        padding-right: 2px;
        border-left: 1px solid var(--panel-border);
      }

      .role-link:hover {
        color: var(--accent);
      }

      .role-link:hover .role-link-copy strong {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .role-link-copy,
      .role-link-copy strong,
      .role-link-copy > span {
        display: block;
      }

      .role-link-copy > span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .role-link b {
        color: var(--accent);
        font-size: 1.05rem;
      }

      .workflow-jump,
      .text-link {
        color: var(--accent);
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: rgba(15, 118, 110, 0.35);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .workflow-jump {
        flex: 0 0 auto;
        margin-bottom: 7px;
        white-space: nowrap;
      }

      .workflow-jump:hover,
      .text-link:hover {
        text-decoration-color: currentColor;
      }

      .journey-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
        margin: 22px 0 0;
        padding: 0 !important;
        list-style: none;
      }

      .journey-step {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        padding-top: 16px;
        border-top: 2px solid rgba(15, 118, 110, 0.24);
      }

      .journey-step strong {
        display: block;
        margin-bottom: 5px;
      }

      .journey-step p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .journey-number {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 800;
      }

      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 22px;
      }

      .section-heading h2 {
        margin-bottom: 6px;
        font-size: clamp(1.8rem, 4vw, 2.55rem);
      }

      .section-heading p {
        max-width: 68ch;
        margin: 0;
      }

      .workflow-kicker {
        display: inline-flex;
        margin-bottom: 9px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .workflow-list {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .workflow-checkpoint {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: center;
        min-width: 0;
        padding: 22px 24px;
        border: 1px solid rgba(217, 119, 6, 0.24);
        border-left: 5px solid var(--accent-2);
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(217, 119, 6, 0.12), rgba(255, 255, 255, 0.94));
      }

      .workflow-checkpoint .workflow-kicker {
        margin-bottom: 8px;
        color: var(--accent-2);
      }

      .workflow-checkpoint h3 {
        margin: 0 0 7px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }

      .workflow-checkpoint p {
        max-width: 65ch;
        margin: 0;
      }

      .workflow-checkpoint .button {
        white-space: nowrap;
      }

      .workflow-step {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(250px, 0.85fr);
        gap: 24px;
        align-items: stretch;
        min-width: 0;
        padding: 22px;
        border: 1px solid rgba(29, 35, 43, 0.1);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(255, 252, 246, 0.9));
      }

      .workflow-step.workflow-step-stack {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .workflow-copy {
        align-self: center;
        min-width: 0;
      }

      .step-label {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        margin-bottom: 13px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .workflow-step h3 {
        margin: 0 0 9px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }

      .workflow-step p {
        margin: 0;
      }

      .workflow-step p + p,
      .workflow-step p + ul,
      .workflow-step ul + p {
        margin-top: 11px;
      }

      .workflow-step ul {
        margin-bottom: 0;
      }

      .screenshot-slot {
        display: grid;
        min-height: 300px;
        margin: 0;
        padding: 16px;
        place-items: center;
        border: 2px dashed rgba(15, 118, 110, 0.25);
        border-radius: 20px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.72)),
          repeating-linear-gradient(135deg, rgba(15, 118, 110, 0.08) 0 10px, transparent 10px 20px);
        color: var(--muted);
        text-align: center;
      }

      .screenshot-slot figcaption {
        max-width: 24ch;
      }

      .screenshot-slot .phone-mark {
        display: grid;
        width: 42px;
        height: 64px;
        margin: 0 auto 13px;
        place-items: end center;
        border: 3px solid rgba(15, 118, 110, 0.45);
        border-radius: 9px;
      }

      .screenshot-slot .phone-mark::after {
        content: "";
        width: 12px;
        height: 3px;
        margin-bottom: 5px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.45);
      }

      .screenshot-slot strong,
      .screenshot-slot figcaption > span:not(.phone-mark) {
        display: block;
      }

      .screenshot-slot strong {
        margin-bottom: 6px;
        color: var(--accent);
      }

      .screenshot-slot span {
        font-size: 0.9rem;
        line-height: 1.55;
      }

      .screenshot-slot img {
        width: 100%;
        max-height: 560px;
        object-fit: contain;
        border-radius: 14px;
      }

      .screenshot-slot.screenshot-image {
        align-self: center;
        min-height: 0;
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
      }

      .screenshot-slot.screenshot-image img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 640px;
        margin: 0 auto;
        object-fit: contain;
        border-radius: 18px;
        box-shadow: 0 18px 38px rgba(18, 26, 33, 0.13);
      }

      .screenshot-slot.screenshot-image.screenshot-stack {
        display: block;
        padding: 0 12px 12px;
      }

      .screenshot-slot.screenshot-image.screenshot-stack img {
        width: 100%;
        max-width: none;
        max-height: none;
      }

      .screenshot-slot.screenshot-image img[src*="/assets/android/"] {
        width: auto;
        max-width: min(100%, 360px);
      }

      .screenshot-slot.screenshot-image img + img {
        margin-top: 16px;
      }

      .download-panel {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
        gap: 24px;
        align-items: center;
        padding: 24px;
        border: 1px solid rgba(15, 118, 110, 0.16);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(15, 118, 110, 0.09), rgba(255, 255, 255, 0.88));
      }

      .download-panel h3 {
        margin: 9px 0 8px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 1.55rem;
        letter-spacing: -0.02em;
      }

      .download-panel p {
        margin: 0;
      }

      .file-badge {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .download-actions,
      .sample-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
      }

      .file-details {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 9px 13px;
        margin: 0;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(29, 35, 43, 0.08);
      }

      .file-details dt {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .file-details dd {
        min-width: 0;
        margin: 0;
        font-size: 0.91rem;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      .file-details code {
        padding: 0;
        background: transparent;
        font-size: 0.78rem;
        font-weight: 600;
        word-break: break-all;
      }

      .install-steps {
        margin-top: 18px;
      }

      .settings-paths {
        margin: 10px 0 0;
      }

      .settings-paths strong {
        display: inline;
        font-size: inherit;
      }

      .security-note {
        border-left-color: #b91c1c;
        background: rgba(185, 28, 28, 0.07);
      }

      .sample-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      .sample-card {
        overflow: hidden;
        border: 1px solid rgba(29, 35, 43, 0.1);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 12px 28px rgba(18, 26, 33, 0.05);
      }

      .sample-media {
        display: block;
        padding: 12px;
        border-bottom: 1px solid rgba(29, 35, 43, 0.08);
        background: linear-gradient(145deg, rgba(15, 118, 110, 0.08), rgba(217, 119, 6, 0.06));
      }

      .sample-media img {
        display: block;
        width: 100%;
        height: 280px;
        border-radius: 16px;
        background: #eef0ed;
        object-fit: contain;
      }

      .sample-card-body {
        padding: 20px;
      }

      .sample-card h3 {
        margin: 0 0 7px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 1.3rem;
        letter-spacing: -0.02em;
      }

      .sample-card p {
        margin: 0;
      }

      .sample-card code {
        overflow-wrap: anywhere;
      }

      .sample-note {
        margin-top: 18px;
      }

      .end-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      code {
        padding: 0.16em 0.38em;
        border-radius: 6px;
        background: rgba(29, 35, 43, 0.08);
        overflow-wrap: anywhere;
      }

      @media (max-width: 860px) {
        .hero-grid,
        .grid-2,
        .role-links,
        .journey-list,
        .workflow-step,
        .download-panel,
        .sample-grid {
          grid-template-columns: 1fr;
        }

        .hero,
        .section {
          padding: 22px;
        }

        .topbar {
          border-radius: 24px;
          align-items: flex-start;
          flex-direction: column;
        }

        .topbar-actions {
          width: 100%;
          align-items: flex-start;
          flex-direction: column;
        }

        .site-nav {
          width: 100%;
          flex-wrap: wrap;
        }

        .nav-menu {
          width: 100%;
        }

        .nav-summary {
          justify-content: space-between;
          width: 100%;
        }

        .nav-dropdown {
          position: static;
          min-width: 0;
          margin-top: 6px;
          box-shadow: none;
        }

        .guide-context {
          padding-left: 0;
          border-left: 0;
          white-space: normal;
        }

        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }

        .workflow-checkpoint {
          grid-template-columns: 1fr;
        }

        .workflow-checkpoint .button {
          justify-self: start;
        }

        .role-link {
          padding-inline: 2px;
        }

        .role-link + .role-link {
          border-left: 0;
        }

        .screenshot-slot {
          min-height: 260px;
        }

        .screenshot-slot.screenshot-image {
          min-height: 0;
        }
      }

      @media (max-width: 520px) {
        .shell {
          padding-inline: 14px;
        }

        .hero,
        .section,
        .workflow-step,
        .workflow-checkpoint {
          padding: 18px;
        }

        .workflow-checkpoint .button {
          width: 100%;
          white-space: normal;
        }

        .nav-link {
          padding-inline: 11px;
        }

        .download-panel,
        .sample-card-body {
          padding: 18px;
        }

        .file-details {
          grid-template-columns: 1fr;
        }

        .file-details dd + dt {
          margin-top: 5px;
        }

        .sample-media img {
          height: 220px;
        }

        .sample-actions .button,
        .download-actions .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong><a href="{{ '/' | relative_url }}">RouteGuardians Manual</a></strong>
          <span>{{ page.header_subtitle | default: "TransitOps Judge Walkthrough" }}</span>
        </div>
        <div class="topbar-actions">
          <nav class="site-nav" aria-label="Guide navigation">
            <details class="nav-menu"{% if page.url == '/' or page.url contains '/android-app/' or page.url contains '/ios-web-app/' %} data-current="true"{% endif %}>
              <summary class="nav-link nav-summary">Bus Captain workflow</summary>
              <div class="nav-dropdown">
                <a class="nav-link" href="{{ '/android-app/' | relative_url }}"{% if page.url contains '/android-app/' %} aria-current="page"{% endif %}>Android app</a>
                <a class="nav-link" href="{{ '/ios-web-app/' | relative_url }}"{% if page.url contains '/ios-web-app/' %} aria-current="page"{% endif %}>iOS web app</a>
              </div>
            </details>
            <a class="nav-link" href="{{ '/web-dashboard/' | relative_url }}"{% if page.url contains '/web-dashboard/' %} aria-current="page"{% endif %}>Operations Officer workflow</a>
          </nav>
          <div class="guide-context">{{ page.guide_label | default: "Operations officer workflow" }}</div>
        </div>
      </header>

      <main>
        {{ content }}
      </main>
    </div>
  </body>
</html>
