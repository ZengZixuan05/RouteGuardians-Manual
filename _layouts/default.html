<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(34, 43, 54, 0.12);
        --text: #1d232b;
        --muted: #5c6773;
        --accent: #0f766e;
        --accent-2: #d97706;
        --shadow: 0 24px 60px rgba(18, 26, 33, 0.12);
        --radius: 28px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Aptos", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(217, 119, 6, 0.12), transparent 28%),
          linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid rgba(15, 118, 110, 0.32);
        outline-offset: 4px;
        border-radius: 8px;
      }

      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 20px 72px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(18, 26, 33, 0.06);
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand a {
        color: inherit;
        text-decoration: none;
      }

      .brand strong {
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .brand span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .topbar-actions,
      .site-nav {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 9px 13px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 650;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .nav-link:hover {
        color: var(--accent);
        background: rgba(15, 118, 110, 0.08);
        transform: translateY(-1px);
      }

      .nav-link[aria-current="page"] {
        color: var(--accent);
        background: rgba(15, 118, 110, 0.1);
      }

      .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: calc(var(--radius) + 6px);
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        padding: 42px;
        margin-bottom: 28px;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -80px -120px auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 119, 6, 0.2), transparent 70%);
        pointer-events: none;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(290px, 0.9fr);
        gap: 28px;
        align-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 14px;
      }

      .eyebrow::before {
        content: "";
        width: 42px;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), rgba(15, 118, 110, 0.2));
        border-radius: 999px;
      }

      h1 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.4rem, 5vw, 4.3rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 68ch;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 46px;
        padding: 11px 17px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #0c9187);
        box-shadow: 0 10px 22px rgba(15, 118, 110, 0.18);
        color: #fff;
        font-size: 0.96rem;
        font-weight: 700;
        text-decoration: none;
        transition: box-shadow 160ms ease, transform 160ms ease;
      }

      .button:hover {
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
        transform: translateY(-2px);
      }

      .button-secondary {
        border-color: rgba(15, 118, 110, 0.16);
        background: rgba(15, 118, 110, 0.08);
        box-shadow: none;
        color: var(--accent);
      }

      .button-secondary:hover {
        box-shadow: none;
        background: rgba(15, 118, 110, 0.13);
      }

      .action-note {
        color: var(--muted);
        font-size: 0.94rem;
      }

      .card {
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 14px 30px rgba(18, 26, 33, 0.05);
        padding: 22px;
      }

      .quickfacts {
        display: grid;
        gap: 14px;
      }

      .quickfact {
        padding: 16px 18px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0.03));
        border: 1px solid rgba(15, 118, 110, 0.12);
      }

      .quickfact small {
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .quickfact strong {
        display: block;
        font-size: 1.02rem;
        line-height: 1.5;
      }

      .credential-lines {
        display: grid;
        gap: 9px;
      }

      .credential-line span {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .credential-line code {
        display: inline-block;
        max-width: 100%;
        padding: 0;
        background: transparent;
        color: var(--text);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.96rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .section {
        margin-top: 22px;
        padding: 30px 32px;
        border-radius: var(--radius);
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 16px 40px rgba(18, 26, 33, 0.05);
      }

      .section h2 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }

      .section p,
      .section li {
        font-size: 1.02rem;
        line-height: 1.75;
        color: var(--text);
      }

      .section p {
        color: var(--muted);
      }

      .section ul,
      .section ol {
        padding-left: 1.25rem;
      }

      .section li + li {
        margin-top: 0.35rem;
      }

      .timeline {
        display: grid;
        gap: 14px;
        counter-reset: step;
      }

      .step {
        position: relative;
        padding: 18px 18px 18px 62px;
        border-radius: 20px;
        border: 1px solid rgba(29, 35, 43, 0.1);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 252, 246, 0.95));
      }

      .step::before {
        counter-increment: step;
        content: counter(step);
        position: absolute;
        left: 18px;
        top: 18px;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), #0c9a8f);
        color: white;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .step strong {
        display: block;
        font-size: 1.03rem;
        margin-bottom: 6px;
      }

      .step p {
        margin: 0;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .muted {
        color: var(--muted);
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(29, 35, 43, 0.06);
        color: var(--text);
        font-size: 0.92rem;
        font-weight: 600;
      }

      .callout {
        margin-top: 18px;
        padding: 18px 20px;
        border-left: 4px solid var(--accent-2);
        background: rgba(217, 119, 6, 0.08);
        border-radius: 18px;
      }

      .callout strong {
        display: block;
        margin-bottom: 6px;
      }

      .callout p:last-child,
      .callout span:last-child {
        margin-bottom: 0;
      }

      .role-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .role-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 92px;
        padding: 18px 20px;
        border: 1px solid rgba(15, 118, 110, 0.14);
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(15, 118, 110, 0.08), rgba(255, 255, 255, 0.75));
        text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease;
      }

      .role-link:hover {
        border-color: rgba(15, 118, 110, 0.34);
        transform: translateY(-2px);
      }

      .role-link-copy,
      .role-link-copy strong,
      .role-link-copy > span {
        display: block;
      }

      .role-link-copy > span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .role-link b {
        color: var(--accent);
        font-size: 1.35rem;
      }

      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 22px;
      }

      .section-heading h2 {
        margin-bottom: 6px;
        font-size: clamp(1.8rem, 4vw, 2.55rem);
      }

      .section-heading p {
        max-width: 68ch;
        margin: 0;
      }

      .workflow-kicker {
        display: inline-flex;
        margin-bottom: 9px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .workflow-list {
        display: grid;
        gap: 18px;
      }

      .workflow-step {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(250px, 0.85fr);
        gap: 24px;
        align-items: stretch;
        padding: 22px;
        border: 1px solid rgba(29, 35, 43, 0.1);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(255, 252, 246, 0.9));
      }

      .workflow-copy {
        align-self: center;
      }

      .step-label {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        margin-bottom: 13px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .workflow-step h3 {
        margin: 0 0 9px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }

      .workflow-step p {
        margin: 0;
      }

      .workflow-step p + p,
      .workflow-step p + ul,
      .workflow-step ul + p {
        margin-top: 11px;
      }

      .workflow-step ul {
        margin-bottom: 0;
      }

      .screenshot-slot {
        display: grid;
        min-height: 300px;
        margin: 0;
        padding: 16px;
        place-items: center;
        border: 2px dashed rgba(15, 118, 110, 0.25);
        border-radius: 20px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.72)),
          repeating-linear-gradient(135deg, rgba(15, 118, 110, 0.08) 0 10px, transparent 10px 20px);
        color: var(--muted);
        text-align: center;
      }

      .screenshot-image {
        min-height: 0;
        padding: 0;
        border: 0;
        background: transparent;
      }

      .screenshot-slot figcaption {
        max-width: 24ch;
      }

      .screenshot-slot .phone-mark {
        display: grid;
        width: 42px;
        height: 64px;
        margin: 0 auto 13px;
        place-items: end center;
        border: 3px solid rgba(15, 118, 110, 0.45);
        border-radius: 9px;
      }

      .screenshot-slot .phone-mark::after {
        content: "";
        width: 12px;
        height: 3px;
        margin-bottom: 5px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.45);
      }

      .screenshot-slot strong,
      .screenshot-slot figcaption > span:not(.phone-mark) {
        display: block;
      }

      .screenshot-slot strong {
        margin-bottom: 6px;
        color: var(--accent);
      }

      .screenshot-slot span {
        font-size: 0.9rem;
        line-height: 1.55;
      }

      .screenshot-slot img {
        width: 100%;
        max-height: 560px;
        object-fit: contain;
        border-radius: 14px;
      }

      .screenshot-image img {
        max-height: none;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(18, 26, 33, 0.08);
      }

      .end-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      code {
        padding: 0.16em 0.38em;
        border-radius: 6px;
        background: rgba(29, 35, 43, 0.08);
      }

      @media (max-width: 860px) {
        .hero-grid,
        .grid-2,
        .role-links,
        .workflow-step {
          grid-template-columns: 1fr;
        }

        .hero,
        .section {
          padding: 22px;
        }

        .topbar {
          border-radius: 24px;
          align-items: flex-start;
          flex-direction: column;
        }

        .topbar-actions {
          width: 100%;
          align-items: flex-start;
          flex-direction: column;
        }

        .site-nav {
          width: 100%;
          flex-wrap: wrap;
        }

        .pill {
          white-space: normal;
        }

        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }

        .screenshot-slot {
          min-height: 260px;
        }
      }

      @media (max-width: 520px) {
        .shell {
          padding-inline: 14px;
        }

        .hero,
        .section,
        .workflow-step {
          padding: 18px;
        }

        .nav-link {
          padding-inline: 11px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong><a href="{{ '/' | relative_url }}">RouteGuardians Manual</a></strong>
          <span>{{ page.header_subtitle | default: "TransitOps Judge Walkthrough" }}</span>
        </div>
        <div class="topbar-actions">
          <nav class="site-nav" aria-label="Guide navigation">
            <a class="nav-link" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Web dashboard</a>
            <a class="nav-link" href="{{ '/android-app/' | relative_url }}"{% if page.url contains '/android-app/' %} aria-current="page"{% endif %}>Android app</a>
          </nav>
          <div class="pill">{{ page.guide_label | default: "Built for the officer workflow" }}</div>
        </div>
      </header>

      <main>
        {{ content }}
      </main>
    </div>
  </body>
</html>
