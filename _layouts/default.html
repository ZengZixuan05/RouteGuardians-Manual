<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root {
        --bg: #f7f5ef;
        --paper: #ffffff;
        --border: #d8d2c5;
        --text: #20252d;
        --muted: #5b6472;
        --accent: #1f5d7a;
        --note: #f0f6fb;
        --warn: #fff4df;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Aptos", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: inherit;
      }

      .shell {
        max-width: 900px;
        margin: 0 auto;
        padding: 28px 20px 72px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 0 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 34px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand strong {
        font-size: 1rem;
        letter-spacing: 0.02em;
        color: var(--accent);
      }

      .brand span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      code {
        padding: 0.16em 0.38em;
        border-radius: 6px;
        background: rgba(31, 93, 122, 0.08);
      }

      main {
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 34px 32px;
        box-shadow: 0 10px 24px rgba(32, 37, 45, 0.05);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.65;
      }

      .manual-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 26px;
        padding: 14px 0 0;
        border-top: 1px solid var(--border);
      }

      .meta {
        display: inline-block;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #faf8f3;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .section {
        padding-top: 22px;
        margin-top: 22px;
        border-top: 1px solid var(--border);
      }

      .section h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }

      .section p,
      .section li {
        font-size: 1rem;
        line-height: 1.7;
        color: var(--text);
      }

      .section p {
        color: var(--muted);
      }

      .section ul,
      .section ol {
        margin: 0;
        padding-left: 1.2rem;
      }

      .section li + li {
        margin-top: 0.3rem;
      }

      .procedure {
        counter-reset: step;
        padding-left: 0;
      }

      .procedure > li {
        list-style: none;
        position: relative;
        padding: 0 0 0 44px;
        margin-top: 18px;
      }

      .procedure > li::before {
        counter-increment: step;
        content: counter(step) ".";
        position: absolute;
        left: 0;
        top: 0;
        color: var(--accent);
        font-weight: 700;
        font-size: 1.05rem;
      }

      .step-title {
        display: block;
        margin: 0 0 5px;
        font-weight: 700;
        color: var(--text);
      }

      .note {
        margin: 16px 0 0;
        padding: 14px 16px;
        border-left: 4px solid var(--accent);
        background: var(--note);
        color: var(--muted);
      }

      .warning {
        margin: 16px 0 0;
        padding: 14px 16px;
        border-left: 4px solid #c58a2a;
        background: var(--warn);
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          padding: 24px 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong>RouteGuardians Manual</strong>
          <span>TransitOps Judge Walkthrough</span>
        </div>
      </header>

      <main>
        {{ content }}
      </main>
    </div>
  </body>
</html>
